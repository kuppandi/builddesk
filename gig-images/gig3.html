<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:769px;overflow:hidden}
  body{background:#0b0d10;color:#e8edf4;font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
       display:flex;flex-direction:column;justify-content:center;padding:0 76px;position:relative}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;
        background:radial-gradient(circle,rgba(251,191,36,.13),transparent 62%);right:-340px;bottom:-360px}
  .kick{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:700;color:#fbbf24;
        letter-spacing:.14em;text-transform:uppercase;margin-bottom:26px}
  .dot{width:11px;height:11px;border-radius:50%;background:#fbbf24}
  h1{font-size:74px;line-height:1.04;font-weight:850;letter-spacing:-.035em;max-width:15ch}
  .sub{font-size:28px;color:#93a1b5;margin-top:24px;max-width:27ch;line-height:1.4}
  .row{display:flex;gap:12px;margin-top:44px;flex-wrap:wrap}
  .pill{border:1.5px solid #29323f;border-radius:10px;padding:13px 22px;font-size:21px;
        color:#cfd8e4;font-weight:650;background:#12161c}
  .brand{position:absolute;right:76px;bottom:54px;font-size:24px;font-weight:800;color:#5d6b7d}
  .price{position:absolute;left:76px;bottom:48px;font-size:30px;font-weight:800}
  .price span{color:#fbbf24}
</style></head><body>
  <div class="glow"></div>
  <div class="kick"><span class="dot"></span>LIVE TOMORROW</div>
  <h1>One page. Fast. Looks right on a phone.</h1>
  <p class="sub">Hand-coded landing page, deployed to a URL you own. No builder, no monthly fee.</p>
  <div class="row"><span class="pill">Mobile-first</span><span class="pill">Form wired</span><span class="pill">Lighthouse 90+</span><span class="pill">Your copy, tightened</span></div>
  <div class="price">from <span>₹1,499</span> / $19</div>
  <div class="brand">BuildDesk</div>
</body></html>
