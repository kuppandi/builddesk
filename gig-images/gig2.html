<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:769px;overflow:hidden}
  body{background:#0b0d10;color:#e8edf4;font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
       display:flex;flex-direction:column;justify-content:center;padding:0 76px;position:relative}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;
        background:radial-gradient(circle,rgba(56,189,248,.15),transparent 62%);right:-330px;top:-300px}
  .kick{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:700;color:#38bdf8;
        letter-spacing:.14em;text-transform:uppercase;margin-bottom:26px}
  .dot{width:11px;height:11px;border-radius:50%;background:#38bdf8}
  h1{font-size:72px;line-height:1.04;font-weight:850;letter-spacing:-.035em;max-width:16ch}
  .sub{font-size:28px;color:#93a1b5;margin-top:24px;max-width:27ch;line-height:1.4}
  .row{display:flex;gap:14px;margin-top:44px;flex-wrap:wrap}
  .pill{border:1.5px solid #29323f;border-radius:999px;padding:11px 24px;font-size:22px;
        color:#cfd8e4;font-weight:600;background:#12161c}
  .brand{position:absolute;right:76px;bottom:54px;font-size:24px;font-weight:800;color:#5d6b7d}
  .price{position:absolute;left:76px;bottom:48px;font-size:30px;font-weight:800}
  .price span{color:#38bdf8}
  .stats{display:flex;gap:54px;margin-top:40px}
  .stat b{display:block;font-size:44px;font-weight:850;color:#38bdf8;letter-spacing:-.03em}
  .stat span{font-size:19px;color:#8e9aab;font-weight:600}
</style></head><body>
  <div class="glow"></div>
  <div class="kick"><span class="dot"></span>DATA CLEANUP</div>
  <h1>I'll clean, dedupe and normalise your spreadsheet</h1>
  <p class="sub">You get it back clean — plus the script that does it again next month.</p>
  <div class="stats">
    <div class="stat"><b>Before/after</b><span>count of every change</span></div>
    <div class="stat"><b>Rerunable</b><span>one command, next month</span></div>
  </div>
  <div class="price">from <span>₹1,499</span> / $19</div>
  <div class="brand">BuildDesk</div>
</body></html>
